plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iinpublic.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.iinpublic.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Location services
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    
    // WebSocket for Gun.js communication
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    
    // JSON handling
    implementation 'com.squareup.moshi:moshi:1.15.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'

    // Embedded Node runtime (Gun P2P node). Pin to the current published AAR.
    // See https://github.com/nodejs-mobile/nodejs-mobile
    // implementation 'com.janeasystems:nodejs-mobile:0.3.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Stage the embedded Node project into the APK assets:
//   - platforms/mobile/nodejs-project (main.js + package.json)
//   - repo dist/server + dist/web (compiled, reused from the web/server build)
// Run `npm run build:web && npm run build:server` at the repo root first.
def repoRoot = "${rootProject.projectDir}/.."
task stageNodeProject(type: Copy) {
    from("${repoRoot}/platforms/mobile/nodejs-project")
    into("${projectDir}/src/main/assets/nodejs-project")
}
task stageNodeDist(type: Copy) {
    from("${repoRoot}/dist") { include 'server/**', 'web/**' }
    into("${projectDir}/src/main/assets/nodejs-project/dist")
}
preBuild.dependsOn stageNodeProject, stageNodeDist