plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iinpublic.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.iinpublic.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // NDK: embed only the ABIs we have libnode.so for and ship with CMake glue
        ndkVersion = "25.1.8937393"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cFlags "-std=c11"
                cppFlags "-std=c++20 -frtti -fexceptions"
            }
        }
    }

    // Wire up CMake so .so files from libnode/ are linked via native-lib
    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // registerForActivityResult / ActivityResultContracts (POST_NOTIFICATIONS runtime request)
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Location services
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    
    // WebSocket for Gun.js communication
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    
    // JSON handling
    implementation 'com.squareup.moshi:moshi:1.15.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'

    // Embedded Node runtime (Gun P2P node).
    //
    // CORRECTION (verified against https://nodejs-mobile.github.io/docs/guide/guide-android/getting-started/,
    // 2026-06): there is no `com.janeasystems:nodejs-mobile` (or similar) Maven
    // artifact to `implementation` here — that coordinate doesn't exist. The
    // upstream project (https://github.com/nodejs-mobile/nodejs-mobile) ships
    // libnode as a prebuilt native library ZIP per release
    // (https://github.com/nodejs-mobile/nodejs-mobile/releases), wired in via
    // CMake + JNI, not a Gradle dependency coordinate:
    //   1. Download the release ZIP; copy include/ -> app/libnode/include,
    //      bin/{arm64-v8a,armeabi-v7a,x86_64}/libnode.so -> app/libnode/bin/<abi>/.
    //   2. app/CMakeLists.txt: include_directories(libnode/include/node/),
    //      add an IMPORTED SHARED `libnode` target pointed at
    //      libnode/bin/${ANDROID_ABI}/libnode.so, and link it into native-lib.
    //   3. defaultConfig: ndk { abiFilters "armeabi-v7a","arm64-v8a","x86_64" }
    //      and externalNativeBuild.cmake.arguments "-DANDROID_STL=c++_shared".
    //   4. android.sourceSets.main.jniLibs.srcDirs 'libnode/bin/'.
    //   5. A JNI C++ shim (app/src/main/cpp/, none exists yet in this project)
    //      exposing `startNodeWithArguments(String[])` -> `node::Start(argc, argv)`,
    //      called from NodeBridge.kt instead of the placeholder log line there.
    // This needs Android Studio + NDK r24+ + CMake to write and verify the JNI/
    // CMake glue correctly — not attempted blind here. See platforms/mobile/README.md.

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Stage the embedded Node project into the APK assets:
//   - platforms/mobile/nodejs-project (main.js + package.json)
//   - repo dist/server + dist/web (compiled, reused from the web/server build)
// Run `npm run build:web && npm run build:server` at the repo root first.
def repoRoot = "${rootProject.projectDir}/.."
task stageNodeProject(type: Copy) {
    from("${repoRoot}/platforms/mobile/nodejs-project")
    into("${projectDir}/src/main/assets/nodejs-project")
}
task stageNodeDist(type: Copy) {
    from("${repoRoot}/dist") { include 'server/**', 'web/**' }
    into("${projectDir}/src/main/assets/nodejs-project/dist")
}
preBuild.dependsOn stageNodeProject, stageNodeDist