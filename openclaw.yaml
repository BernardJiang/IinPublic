# iinpublic/openclaw.yml
model: qwen2.5-coder

system_prompt: |
  You are a testing assistant.
  When given test output, summarize:
  - total tests
  - passed
  - failed
  - key errors
  - root cause if possible

tools:
  - name: run_e2e
    description: Run end-to-end tests and return results
    command: ./tools/run_e2e.sh

workflows:
  - name: test_and_summarize
    steps:
      - tool: run_e2e
      - llm: summarize the test results clearly
